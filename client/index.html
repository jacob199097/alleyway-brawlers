<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <title>AlleyWay Brawlers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width:  100%;
      height: 100%;
      background: #0d0d1a;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      width:  100%;
      height: 100%;
      position: relative;
      /* Phaser letterboxes with canvas margin-top; without this the margin collapses onto the
         container and the DOM layer (login inputs) ends up offset by it twice */
      display: flow-root;
    }
    canvas { display: block; }
    /* Desktop (Electron) shell: mouse-driven, no touch gesture suppression */
    html.desktop, html.desktop body { touch-action: auto; }

  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
