# Runs on every push and pull request (GitHub → Actions tab shows the results).
#   server: online matches, Scissors Paper Rock, rematches, replays (backend/socket/*.test.cjs)
#   database: crafting, achievements, account deletion and the auction house against a real Postgres
#             (backend/economy/progression.test.cjs, backend/routes/account.test.cjs, backend/economy/auction.test.cjs),
#             plus the website's pages (backend/site/site.test.cjs: no database, but it needs the server's packages)
#   godot:  both rules engines agree (golden test), plus the duel, tutorial and rules smoke tests
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  server:
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Online matches and Scissors Paper Rock
        run: node backend/socket/rps.test.cjs
      - name: Ranked is player against player only
        run: node backend/socket/ranked.test.cjs
      - name: Rematches and away players
        run: node backend/socket/rematch.test.cjs
      - name: Replays match live play
        run: node backend/socket/replay.test.cjs
      - name: Spectators
        run: node backend/socket/spectate.test.cjs
      - name: Free-for-all lobby and matches
        run: node backend/socket/ffa.test.cjs
      - name: Turf Defense quick match and matches
        run: node backend/socket/coop.test.cjs
      - name: MARKED (reveal) shows only the viewer their opponents' hidden cards
        run: node backend/socket/reveal.test.cjs
      - name: Neutral cards and one clan per deck
        run: node shared/clans.test.mjs
      - name: Card Forge passives do what their text says
        run: node shared/duel/passives.test.mjs
      - name: Free-for-all rules (3-4 players)
        run: node shared/duel/ffa.test.mjs
      - name: Deck searches and set Hustles
        run: node shared/duel/hustles.test.mjs
      - name: Luck (coin flips and die rolls)
        run: node shared/duel/luck.test.mjs
      - name: Loot, top of the deck, exile, swap, BOUNTY, LIFESTEAL
        run: node shared/duel/blocks.test.mjs
      - name: Burn (STOKE, for each / only BURNING, a Dormant leader's burn)
        run: node shared/duel/burn.test.mjs
      - name: PLUNDER (hand, deck, Gutter, field) and Gutter abilities
        run: node shared/duel/plunder.test.mjs
      - name: Rules fixes (promote-then-hit, deployed first, INFILTRATE, FFA Authority, boss Influence)
        run: node shared/duel/rules_fixes.test.mjs
      - name: CHARM, UNDEAD, promoting a Striver, tribute damage, flipping Continuous Ambushes
        run: node shared/duel/charm.test.mjs
      - name: Underworld effects (give UNDEAD, raise from the enemy Gutter, exile Gutter cards, fill your own Gutter)
        run: node shared/duel/underworld.test.mjs
      - name: A leader Awakens mid-turn when Morale drops
        run: node shared/duel/awaken.test.mjs
      - name: Turf Defense rules (teams, the boss's Morale and phases) and every boss level plays through
        run: node shared/duel/turf.test.mjs
      - name: Card Forge combos (new triggers, targets, conditions, counts, TAX, reshuffle)
        run: node shared/duel/combos.test.mjs
      - name: Random moves (every card, 2-4 players, junk input) never break the rules
        run: node shared/duel/fuzz.test.mjs

  database:
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19)
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install server packages
        run: npm ci --prefix backend --omit=dev
      - name: Only the game and the server's own pages may call in (CORS)
        run: node backend/utils/origins.test.cjs
      - name: The website (every page, card and Striver line; nothing loaded from other sites; the game's calls left alone)
        run: node backend/site/site.test.cjs
      - name: The account emails (the link, pictures only from the website, nothing that tracks, under Gmail's size limit)
        run: node backend/utils/mailer.test.cjs
      - name: Ranked seasons (Ranked games and the season's best counted, ending a season, rewards claimed once)
        run: node backend/economy/seasons.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: Crafting and achievements
        run: node backend/economy/progression.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: Account deletion
        run: node backend/routes/account.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: Steam sign-in, linking and purchases
        run: node backend/routes/steam.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: Turf Defense rewards
        run: node backend/economy/turf.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: Veteran cards and the turf map
        run: node backend/economy/territory.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
      - name: The auction house (listing, bids, the end, limits, abuse flags)
        run: node backend/economy/auction.test.cjs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres

  godot:
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Copy art and audio into the project
        run: sh godot/tools/sync_assets.sh
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import the project
        # In the quick picture format, on this machine only: the game's own (the sharp desktop one, plus the
        # phone and Mac copies) took over 10 minutes here once the art grew, and the cut-off import failed the
        # duel smoke test in every run from 0.9.77 on. The tests never draw a picture, so the format is all the
        # same to them. An import that runs out of time now fails here, under its own name.
        run: |
          sed -i -e 's|"compress/high_quality": true|"compress/high_quality": false|' -e 's|^textures/vram_compression/import_etc2_astc=true|textures/vram_compression/import_etc2_astc=false|' godot/project.godot
          code=0; timeout 900 ~/godot/godot --headless --path godot --import || code=$?
          if [ "$code" -eq 124 ]; then echo "::error::The import ran out of time (15 minutes)"; exit 1; fi
      - name: Both rules engines agree (golden test)
        run: |
          ~/godot/godot --headless --path godot --script res://tests/export_golden.gd -- /tmp/golden.json 25
          node shared/duel/engine.test.mjs /tmp/golden.json
      - name: Rules simulation
        run: ~/godot/godot --headless --path godot --script res://tests/sim.gd
      - name: Every script compiles
        run: timeout 300 ~/godot/godot --headless --path godot res://tests/scripts_compile.tscn
      - name: Duel screen smoke test
        run: timeout 600 ~/godot/godot --headless --path godot res://tests/ui_smoke.tscn
      - name: Tutorial smoke test
        run: timeout 600 ~/godot/godot --headless --path godot res://tests/tutorial_smoke.tscn
      - name: Touch controls (Android)
        run: timeout 300 ~/godot/godot --headless --path godot res://tests/touch_smoke.tscn -- --touch
      - name: Touch controls on a 20:9 phone screen (no black bars)
        run: timeout 300 ~/godot/godot --headless --path godot res://tests/touch_smoke.tscn -- --touch --mobile
